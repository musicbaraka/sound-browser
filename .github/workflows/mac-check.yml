name: Mac build check
on:
  push:
    branches: [mac-test]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build Mac app
        run: npx electron-builder --mac --publish never
      - name: Check the app
        run: |
          ls -la dist
          for a in dist/mac-arm64/"Sound Browser.app" dist/mac/"Sound Browser.app"; do
            [ -d "$a" ] || continue
            echo "== $a"
            codesign -dv "$a" 2>&1 | grep -E "Signature|Identifier|Format" || true
            codesign --verify --deep --strict "$a" && echo "signature valid"
            lipo -archs "$a/Contents/MacOS/Sound Browser"
          done
      - name: Start the app (Apple Silicon)
        run: |
          APP="dist/mac-arm64/Sound Browser.app/Contents/MacOS/Sound Browser"
          ("$APP" --no-sandbox > run.log 2>&1 &) ; sleep 12
          if pgrep -f "Sound Browser.app/Contents/MacOS/Sound Browser" >/dev/null; then echo "APP IS RUNNING"; pkill -f "Sound Browser.app" || true; else echo "APP DID NOT STAY UP"; cat run.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: mac-build, path: "dist/*.dmg", retention-days: 3 }
