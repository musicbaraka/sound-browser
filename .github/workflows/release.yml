name: Build and release

# Runs on every push to main. If package.json has a version that has not been
# released yet, it builds the Windows installer and publishes it as a GitHub
# Release, then adds the Mac versions (Apple Silicon and Intel) to it.
# Installed apps then update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v5

      - name: Check whether this version is already released
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$V already released, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing v$V."
          fi

      - uses: actions/setup-node@v5
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.v.outputs.exists == 'false'
        run: npm ci

      - name: Check Windows key protection
        if: steps.v.outputs.exists == 'false'
        run: node test/dpapi-check.js

      - name: Build installer
        if: steps.v.outputs.exists == 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sonalogue $V" --generate-notes \
            "dist/Sonalogue-Setup-$V.exe" "dist/Sonalogue-Setup-$V.exe.blockmap" dist/latest.yml

  mac:
    needs: release
    if: needs.release.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build Mac versions
        run: npx electron-builder --mac --publish never
      - name: Check signature and start the app
        run: |
          codesign --verify --deep --strict "dist/mac-arm64/Sonalogue.app" && echo "arm64 signature valid"
          codesign --verify --deep --strict "dist/mac/Sonalogue.app" && echo "x64 signature valid"
          ("dist/mac-arm64/Sonalogue.app/Contents/MacOS/Sonalogue" > run.log 2>&1 &) ; sleep 12
          pgrep -f "Sonalogue.app/Contents/MacOS/Sonalogue" >/dev/null && echo "app runs" || { cat run.log; exit 1; }
          pkill -f "Sonalogue.app" || true
      - name: Add Mac versions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.release.outputs.version }}
          gh release upload "v$V" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/Sonalogue-$V-mac-arm64.dmg dist/Sonalogue-$V-mac-x64.dmg \
            dist/Sonalogue-$V-mac-arm64.zip dist/Sonalogue-$V-mac-x64.zip dist/latest-mac.yml
